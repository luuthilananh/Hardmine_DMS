name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: Trình chạy test không cần pytest
        run: python tests/run_tests.py

  bootstrap:
    name: Bootstrap .venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tạo môi trường riêng và chạy test (đúng như AUTOPILOT bước B)
        shell: bash
        run: python scripts/bootstrap.py
      - name: Dùng Python của dự án cho demo nhanh và kiểm tra lệnh tải dữ liệu
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY scripts/demo_synthetic.py --quick --no-figures --web ""
          $PY scripts/download_driveact.py --dry-run --out "$RUNNER_TEMP/driveact"

  demo:
    name: Demo đầu-cuối trên dữ liệu tổng hợp
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/demo_synthetic.py --web demo/data.js
      - name: Kết quả vào trang tóm tắt của lần chạy
        run: |
          echo "## Kết quả demo trên dữ liệu tổng hợp" >> "$GITHUB_STEP_SUMMARY"
          echo "Chỉ kiểm chứng cơ chế, không phải hiệu năng trên dữ liệu thật." >> "$GITHUB_STEP_SUMMARY"
          cat results/synthetic_demo/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-results
          path: |
            results/synthetic_demo
            demo/data.js
