name: Feature extraction smoke test

on:
  push:
    branches: [main]
    paths: ["src/hardmine/features/**", "tests/test_extract_slow.py", ".github/workflows/extract-smoke.yml"]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,video]" transformers
      - name: Trích đặc trưng với model tí hon (CPU)
        env:
          HARDMINE_SLOW: "1"
        run: pytest -q tests/test_extract_slow.py
