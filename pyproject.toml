[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardmine-dms"
version = "0.1.0.dev0"
description = "Hard-case mining engine for in-cabin driver monitoring video"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Luu Thi Lan Anh"}]
keywords = ["driver monitoring", "active learning", "hard example mining", "in-cabin", "euro ncap"]
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
video = ["opencv-python-headless>=4.8", "decord>=0.6"]
gpu = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.45", "faiss-cpu>=1.8", "timm>=1.0"]
face = ["mediapipe>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
